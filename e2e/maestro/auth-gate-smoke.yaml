appId: com.andrewwatanabe.kwilt
---
# Auth smoke (CI-safe): fresh launch lands on sign-in interstitial.
# This intentionally avoids provider login automation.

- launchApp:
    clearState: true

- openLink: "${DEV_CLIENT_URL}"

# Fresh iOS simulators ask before the first development-client deep link.
# Keep the app's sign-in assertions mandatory after accepting that OS prompt.
- runFlow:
    when:
      visible: 'Open in .*Kwilt.*'
    commands:
      - tapOn: "Open"

- extendedWaitUntil:
    visible: "Continue with Apple"
    timeout: 30000

- assertVisible: "Continue with Apple"
- assertVisible: "Continue with Google"

- takeScreenshot: "auth-gate-smoke"
