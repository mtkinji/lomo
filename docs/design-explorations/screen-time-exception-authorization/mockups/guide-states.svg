    <circle cx="838" cy="712" r="16" fill="#F5F5F4"/><text x="838" y="717" font-size="18" font-weight="450" text-anchor="middle">×</text>
    <text class="guide-body" x="526" y="753">Your weekday evening rule is still in force.</text>
    <rect x="526" y="782" width="318" height="84" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="rule-label" x="542" y="811">WEEKDAY EVENINGS</text>
    <text class="rule-body" x="542" y="842">Available again at 8:00 PM.</text>
    <line x1="526" y1="889" x2="844" y2="889" stroke="#E7E5E4"/>
    <text x="844" y="938" font-size="14" font-weight="600" fill="#315545" text-anchor="end">Manage rules ›</text>
  </g>

  <!-- Phone 3: child / unauthorized -->
  <g filter="url(#phoneShadow)"><rect x="920" y="190" width="390" height="844" rx="48" fill="#FFFFFF" stroke="#D6D3D1"/></g>
