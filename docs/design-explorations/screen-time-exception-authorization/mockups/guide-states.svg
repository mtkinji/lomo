    <rect x="946" y="519" width="338" height="94" rx="18" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="page-label" x="964" y="551">NEXT</text><text class="page-body" x="964" y="580">Pack backpack for tomorrow</text>
    <rect x="920" y="190" width="390" height="844" fill="#0F172A" opacity="0.18"/>

    <g filter="url(#guideShadow)">
      <rect x="932" y="686" width="366" height="336" rx="44" fill="#FFFFFF" stroke="#E7E5E4"/>
    </g>
    <text class="guide-title" x="956" y="732">Games are paused for Riley.</text>
    <circle cx="1268" cy="724" r="16" fill="#F5F5F4"/><text x="1268" y="729" font-size="18" font-weight="450" text-anchor="middle">×</text>
    <text class="guide-body" x="956" y="765">A caregiver’s weeknight rule is in force.</text>
    <rect x="956" y="794" width="318" height="94" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="rule-label" x="972" y="823">WEEKNIGHT ROUTINE</text>
    <text class="rule-body" x="972" y="854">Available tomorrow at 7:00 AM.</text>
  </g>

  <!-- Phone 4: overlap and large text stress state -->
  <g filter="url(#phoneShadow)"><rect x="1350" y="190" width="390" height="844" rx="48" fill="#FFFFFF" stroke="#D6D3D1"/></g>
  <g clip-path="url(#phone4)">
    <rect x="1350" y="190" width="390" height="844" fill="#FFFFFF"/>
    <text class="status" x="1376" y="229">6:53</text><rect x="1504" y="203" width="82" height="25" rx="13" fill="#1C1A19"/>
    <text x="1376" y="282" font-size="23" font-weight="800" fill="#315545">KWILT</text>
    <text class="page-title" x="1376" y="342">Today</text>
    <rect x="1376" y="371" width="338" height="126" rx="18" fill="#F5F5F4"/>
