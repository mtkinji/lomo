<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
  <defs>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1C1A19" flood-opacity="0.13"/>
    </filter>
    <filter id="guideShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#1C1A19" flood-opacity="0.16"/>
    </filter>
    <clipPath id="phone1"><rect x="60" y="190" width="390" height="844" rx="48"/></clipPath>
    <clipPath id="phone2"><rect x="490" y="190" width="390" height="844" rx="48"/></clipPath>
    <clipPath id="phone3"><rect x="920" y="190" width="390" height="844" rx="48"/></clipPath>
    <clipPath id="phone4"><rect x="1350" y="190" width="390" height="844" rx="48"/></clipPath>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1C1A19; }
      .board-title { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
      .board-subtitle { font-size: 17px; font-weight: 400; fill: #57534E; }
      .screen-name { font-size: 19px; font-weight: 700; }
      .screen-note { font-size: 13px; font-weight: 450; fill: #57534E; }
      .status { font-size: 11px; font-weight: 550; fill: #78716C; }
      .page-title { font-size: 29px; font-weight: 750; letter-spacing: -0.6px; }
      .page-label { font-size: 12px; font-weight: 650; letter-spacing: 0.7px; fill: #57534E; }
      .page-body { font-size: 14px; font-weight: 450; fill: #57534E; }
      .guide-title { font-size: 18px; font-weight: 650; letter-spacing: -0.2px; }
      .guide-title-large { font-size: 23px; font-weight: 650; letter-spacing: -0.35px; }
      .guide-body { font-size: 14px; font-weight: 430; fill: #57534E; }
      .guide-body-large { font-size: 18px; font-weight: 430; fill: #57534E; }
      .rule-label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
      .rule-body { font-size: 14px; font-weight: 430; fill: #57534E; }
      .rule-label-large { font-size: 16px; font-weight: 600; }
      .rule-body-large { font-size: 18px; font-weight: 430; fill: #57534E; }
      .button-primary { font-size: 14px; font-weight: 650; fill: #FAFAFA; text-anchor: middle; }
      .button-ghost { font-size: 14px; font-weight: 600; fill: #1C1A19; text-anchor: middle; }
      .button-large { font-size: 18px; font-weight: 650; fill: #FAFAFA; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1800" height="1160" fill="#F1EEE6"/>
  <text class="board-title" x="60" y="62">Screen Time guide: rule-aware recovery</text>
  <text class="board-subtitle" x="60" y="98">The explanation leads. Immediate action appears only when the active rule has one; management stays secondary and adult-only.</text>

  <g>
    <circle cx="76" cy="147" r="14" fill="#315545"/><text x="76" y="152" font-size="13" font-weight="750" fill="#FAF7ED" text-anchor="middle">1</text>
    <text class="screen-name" x="100" y="150">Concrete prerequisite</text>
    <text class="screen-note" x="100" y="171">Rule-derived action leads</text>

    <circle cx="506" cy="147" r="14" fill="#315545"/><text x="506" y="152" font-size="13" font-weight="750" fill="#FAF7ED" text-anchor="middle">2</text>
    <text class="screen-name" x="530" y="150">Time or usage boundary</text>
    <text class="screen-note" x="530" y="171">No invented prerequisite</text>

    <circle cx="936" cy="147" r="14" fill="#315545"/><text x="936" y="152" font-size="13" font-weight="750" fill="#FAF7ED" text-anchor="middle">3</text>
    <text class="screen-name" x="960" y="150">Child or unauthorized</text>
    <text class="screen-note" x="960" y="171">Informational and dismissible</text>

    <circle cx="1366" cy="147" r="14" fill="#315545"/><text x="1366" y="152" font-size="13" font-weight="750" fill="#FAF7ED" text-anchor="middle">4</text>
    <text class="screen-name" x="1390" y="150">Large text + overlap</text>
    <text class="screen-note" x="1390" y="171">Tall guide, truthful combined state</text>
  </g>

  <!-- Phone 1: actionable Focus prerequisite -->
  <g filter="url(#phoneShadow)"><rect x="60" y="190" width="390" height="844" rx="48" fill="#FFFFFF" stroke="#D6D3D1"/></g>
  <g clip-path="url(#phone1)">
    <rect x="60" y="190" width="390" height="844" fill="#FFFFFF"/>
    <text class="status" x="86" y="229">9:41</text><rect x="214" y="203" width="82" height="25" rx="13" fill="#1C1A19"/>
    <text x="86" y="282" font-size="23" font-weight="800" fill="#315545">KWILT</text>
    <text class="page-title" x="86" y="342">Today</text>
    <rect x="86" y="371" width="338" height="126" rx="18" fill="#F5F5F4"/>
    <text class="page-label" x="104" y="402">IN FOCUS</text>
    <text x="104" y="438" font-size="17" font-weight="650">Finish the proposal</text>
    <text class="page-body" x="104" y="467">34 minutes remaining</text>
    <rect x="86" y="519" width="338" height="94" rx="18" fill="#FFFFFF" stroke="#E7E5E4"/>
