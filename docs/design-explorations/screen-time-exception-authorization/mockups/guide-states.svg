    <rect x="60" y="190" width="390" height="844" fill="#0F172A" opacity="0.18"/>

    <g filter="url(#guideShadow)">
      <rect x="72" y="626" width="366" height="396" rx="44" fill="#FFFFFF" stroke="#E7E5E4"/>
    </g>
    <text class="guide-title" x="96" y="672">One thing comes first.</text>
    <circle cx="408" cy="664" r="16" fill="#F5F5F4"/><text x="408" y="669" font-size="18" font-weight="450" text-anchor="middle">×</text>
    <text class="guide-body" x="96" y="705">This app stays paused while Focus is running.</text>
    <rect x="96" y="734" width="318" height="94" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="rule-label" x="112" y="763">FOCUS</text>
    <text class="rule-body" x="112" y="794">Finish or end “Proposal deep work.”</text>
    <line x1="96" y1="851" x2="414" y2="851" stroke="#E7E5E4"/>
    <rect x="96" y="878" width="132" height="48" rx="24" fill="#FFFFFF"/>
    <text x="162" y="908" font-size="14" font-weight="600" fill="#315545" text-anchor="middle">Manage rules ›</text>
    <rect x="238" y="878" width="176" height="48" rx="24" fill="#1C1A19"/>
    <text class="button-primary" x="326" y="908" fill="#FAFAFA">Return to Focus</text>
  </g>

