    <g filter="url(#guideShadow)">
      <rect x="1362" y="304" width="366" height="718" rx="44" fill="#FFFFFF" stroke="#E7E5E4"/>
    </g>
    <text class="guide-title-large" x="1386" y="356">2 rules are keeping</text>
    <text class="guide-title-large" x="1386" y="387">this app paused.</text>
    <circle cx="1698" cy="350" r="18" fill="#F5F5F4"/><text x="1698" y="356" font-size="20" font-weight="450" text-anchor="middle">×</text>
    <text class="guide-body-large" x="1386" y="431">Finishing Focus resolves one rule,</text>
    <text class="guide-body-large" x="1386" y="457">but the evening schedule remains.</text>

    <rect x="1386" y="493" width="318" height="126" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="rule-label-large" x="1404" y="528">Focus</text>
    <text class="rule-body-large" x="1404" y="562">Finish or end “Write the first</text>
    <text class="rule-body-large" x="1404" y="590">draft.”</text>

    <rect x="1386" y="639" width="318" height="126" rx="16" fill="#FFFFFF" stroke="#E7E5E4"/>
    <text class="rule-label-large" x="1404" y="674">Weekday evenings</text>
    <text class="rule-body-large" x="1404" y="708">Available again at 8:00 PM.</text>
    <rect x="1709" y="493" width="3" height="272" rx="2" fill="#E7E5E4"/>
    <rect x="1709" y="493" width="3" height="96" rx="2" fill="#78716C"/>

    <line x1="1386" y1="802" x2="1704" y2="802" stroke="#E7E5E4"/>
    <text x="1386" y="871" font-size="18" font-weight="600" fill="#315545">Manage rules ›</text>
