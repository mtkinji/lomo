    <rect x="490" y="190" width="390" height="844" fill="#0F172A" opacity="0.18"/>

    <g filter="url(#guideShadow)">
      <rect x="502" y="674" width="366" height="348" rx="44" fill="#FFFFFF" stroke="#E7E5E4"/>
