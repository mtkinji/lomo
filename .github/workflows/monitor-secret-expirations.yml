name: Monitor secret expirations

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-auth
    env:
      KWILT_SECRET_MONITOR_URL: "https://auth.kwilt.app/functions/v1/secrets-expiry-monitor"
      KWILT_SECRET_MONITOR_CRON_SECRET: ${{ secrets.KWILT_SECRET_MONITOR_CRON_SECRET }}

    steps:
      - name: Check tracked secret expirations
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $KWILT_SECRET_MONITOR_CRON_SECRET" \
            "$KWILT_SECRET_MONITOR_URL"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; GitHub Actions remains the failure signal."
            exit 0
          fi
          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ("Secret expiration monitor failed for " + $repo + ". " + $url)}')
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
