name: E2E (Maestro)
run-name: Native ${{ inputs.suite || 'scheduled-full' }} / ${{ inputs.group || 'all' }} / ${{ inputs.workspace_flow || 'all' }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Smoke is quick feedback; acceptance includes the complete 4000-row Budget traversal
        type: choice
        options: [acceptance, smoke]
        default: acceptance
      group:
        description: A focused group is diagnostic evidence, not full release acceptance
        type: choice
        options: [all, auth, workspace, budget]
        default: all
      workspace_flow:
        description: Select one workspace flow for diagnosis, or all for acceptance
        type: choice
        options: [all, smoke-devtools, onboarding-plan-ready-touch-regression, arc-banner-touch-regression, activity-detail-key-actions]
        default: all
      force_native_build:
        description: Ignore the exact native-host cache and compile a fresh host
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
jobs:
  native-host:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      key: ${{ steps.identity.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Generate native inputs
        run: CI=1 EXPO_NO_DOTENV=1 npx expo prebuild --platform ios --clean
      - name: Fingerprint native inputs and toolchain
        id: identity
        run: node scripts/e2e/native-host.mjs identity
      - name: Restore exact compatible native host
        id: host_cache
        if: ${{ !inputs.force_native_build }}
        uses: actions/cache/restore@v4
        with:
          path: artifacts/native-ci/host
          key: ${{ steps.identity.outputs.key }}
      - name: Compile only on native cache miss
        if: steps.host_cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          node scripts/e2e/native-host.mjs build 2>&1 | tee artifacts/native-ci/build.log
      - name: Verify native host receipt
        run: node scripts/e2e/native-host.mjs verify
      # Save before any UI job: a failed assertion must never discard this build.
      - name: Save compatible native host
        if: steps.host_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/native-ci/host
          key: ${{ steps.identity.outputs.key }}
      - name: Publish immutable host for this run
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-host
          path: artifacts/native-ci/host
          compression-level: 0
          retention-days: 7
      - name: Native build summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.host_cache.outputs.cache-hit }}
        run: echo "Native host exact-cache hit = ${CACHE_HIT:-false}. Source $GITHUB_SHA. See individual job timings; queue delay is separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-diagnostics
          path: |
            artifacts/native-ci/build.log
            artifacts/native-ci/expected-host.json
          if-no-files-found: warn

  native-tests:
    if: github.event_name == 'workflow_dispatch'
    needs: native-host
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      KWILT_NATIVE_SUITE: ${{ inputs.suite }}
      KWILT_WORKSPACE_FLOW: ${{ inputs.workspace_flow }}
      KWILT_METRO_CACHE_DIR: ${{ github.workspace }}/.cache/native-ci/metro
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-test-runtime
        with:
          native-key: ${{ needs.native-host.outputs.key }}
      - name: Signed-out app
        id: auth
        if: ${{ inputs.group == 'all' || inputs.group == 'auth' }}
        timeout-minutes: 15
        run: node scripts/e2e/native-suite.mjs auth
      - name: Publish auth diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-auth-diagnostics
          path: artifacts/maestro/auth-fixture
          if-no-files-found: ignore
      - name: Workspace interactions
        id: workspace
        if: ${{ !cancelled() && (inputs.group == 'all' || inputs.group == 'workspace') }}
        timeout-minutes: 20
        run: node scripts/e2e/native-suite.mjs workspace
      - name: Publish workspace diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-workspace-diagnostics
          path: artifacts/maestro/workspace-fixture
          if-no-files-found: ignore
      - name: Budget navigation and selected inventory scope
        id: budget
        if: ${{ !cancelled() && (inputs.group == 'all' || inputs.group == 'budget') }}
        timeout-minutes: 30
        run: node scripts/e2e/native-suite.mjs budget
      - name: Publish Budget diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-budget-diagnostics
          path: artifacts/maestro/budget-fixture
          if-no-files-found: ignore
      - name: Save Metro transforms even when a UI assertion fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/native-ci/metro
          key: metro-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '**/metro.config.*', '**/babel.config.*') }}-${{ github.sha }}
      - name: Record exact acceptance scope
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
          GROUP: ${{ inputs.group }}
          FLOW: ${{ inputs.workspace_flow }}
          AUTH: ${{ steps.auth.outcome }}
          WORKSPACE: ${{ steps.workspace.outcome }}
          BUDGET: ${{ steps.budget.outcome }}
        run: node scripts/e2e/native-suite.mjs summary

  maestro-full:
    if: github.event_name == 'schedule'
    needs: native-host
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      KWILT_METRO_CACHE_DIR: ${{ github.workspace }}/.cache/native-ci/metro
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-test-runtime
        with:
          native-key: ${{ needs.native-host.outputs.key }}
      # Existing authenticated flows remain separate; they still need test identity/data.
      - run: bash scripts/e2e/run-maestro-ios.sh e2e/maestro
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-full-diagnostics
          path: artifacts/maestro
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        env:
          KWILT_NATIVE_SUITE: acceptance
        run: node scripts/e2e/native-suite.mjs budget
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-full-budget-diagnostics
          path: artifacts/maestro/budget-fixture
          if-no-files-found: warn
      - name: Save Metro transforms even when a UI assertion fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/native-ci/metro
          key: metro-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '**/metro.config.*', '**/babel.config.*') }}-${{ github.sha }}
