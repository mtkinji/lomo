name: iOS TestFlight (EAS)

on:
  workflow_dispatch:
    inputs:
      backend_check_only:
        description: Check the release backend without building or submitting an app
        type: boolean
        default: false
  push:
    tags:
      - "ios-v*"

jobs:
  verify_backend:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_check_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Verify release backend only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_RELEASE_READ_TOKEN }}
        run: npm run money:verify-backend -- --profile testflight-widgets

  build_and_submit:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.backend_check_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (production-widgets) + auto-submit to TestFlight
        env:
          # Expo token for non-interactive EAS auth.
          # The expo/expo-github-action sets EXPO_TOKEN for the CLI; we keep this for clarity.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Project-scoped read-only Database and Custom Domain permissions.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_RELEASE_READ_TOKEN }}
        run: |
          npm run -s ios:testflight
