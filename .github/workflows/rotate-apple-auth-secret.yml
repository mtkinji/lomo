name: Rotate Apple auth secret

on:
  workflow_dispatch:
  schedule:
    # Rotate monthly, well inside Apple's six-month client-secret limit.
    - cron: "17 8 1 * *"

permissions:
  contents: read

concurrency:
  group: rotate-apple-auth-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-auth
    env:
      APPLE_KEY_ID: "886JSH9JLL"
      APPLE_TEAM_ID: "BK3N7YXHN7"
      APPLE_SERVICES_ID: "com.andrewwatanabe.kwilt.auth"
      SUPABASE_PROJECT_REF: "sqxwjtorodqjdfnuvprf"
      KWILT_SECRET_MONITOR_URL: "https://auth.kwilt.app/functions/v1/secrets-expiry-monitor"
      APPLE_AUTH_PRIVATE_KEY_P8: ${{ secrets.APPLE_AUTH_PRIVATE_KEY_P8 }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      KWILT_SECRET_MONITOR_CRON_SECRET: ${{ secrets.KWILT_SECRET_MONITOR_CRON_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test rotation contract
        run: |
          node --test scripts/apple-auth-secret-rotation.test.mjs
          deno test --no-lock \
            --config supabase/functions/tsconfig.json \
            supabase/functions/_shared/__tests__/secretExpiryMonitor_deno_test.ts

      - name: Rotate Apple provider secret
        run: node scripts/rotate-apple-auth-secret.mjs

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; GitHub Actions remains the failure signal."
            exit 0
          fi
          payload=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{text: ("Apple auth secret rotation failed for " + $repo + ". " + $url)}')
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
